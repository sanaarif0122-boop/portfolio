<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message sent | Sana Arif</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..800,40,1&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #181612;
      --paper: #f2eee2;
      --panel: #fffbef;
      --muted: #666157;
      --line: rgba(24, 22, 18, .16);
      --red: #b64632;
      --teal: #16706d;
      --shadow: 0 28px 80px rgba(38, 31, 21, .16);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background:
        linear-gradient(115deg, rgba(182, 70, 50, .13), transparent 30%),
        linear-gradient(245deg, rgba(22, 112, 109, .16), transparent 38%),
        repeating-linear-gradient(90deg, rgba(24, 22, 18, .045) 0 1px, transparent 1px 76px),
        var(--paper);
    }

    main {
      position: relative;
      max-width: 760px;
      padding: clamp(30px, 7vw, 68px);
      border: 1px solid var(--line);
      background: rgba(255, 251, 239, .82);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    main::before {
      content: "SENT";
      position: absolute;
      right: -16px;
      bottom: -20px;
      color: rgba(22, 112, 109, .1);
      font-family: Fraunces, serif;
      font-size: clamp(86px, 18vw, 190px);
      font-weight: 800;
      line-height: .8;
      pointer-events: none;
    }

    .kicker {
      color: var(--red);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      margin: 10px 0 16px;
      font-family: Fraunces, serif;
      font-size: clamp(54px, 10vw, 104px);
      font-weight: 760;
      line-height: .82;
    }

    p {
      position: relative;
      max-width: 560px;
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 17px;
    }

    a {
      position: relative;
      display: inline-flex;
      padding: 12px 16px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      color: var(--panel);
      background: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Recruiter brief received</div>
    <h1>Message sent.</h1>
    <p>Thanks for reaching out about Sana Arif. The opportunity details have been submitted and the fastest next step is now clear.</p>
    <a href="/">Back to portfolio</a>
  </main>
</body>
</html>
